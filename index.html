<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="系排GO MVTGO2 遊戲主程式入口"
    />
    <title>系排GO MVTGO2</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="home-view" class="home" aria-labelledby="page-title">
        <div class="hero">
          <p class="eyebrow">MVTGO2</p>
          <h1 id="page-title">系排GO MVTGO2</h1>
          <p class="hero__description">建立球隊、培育球員，迎接每一場正式賽事。</p>
          <div class="home-actions">
            <button id="start-game-button" class="primary-button" type="button" disabled>
              開始遊戲
            </button>
            <p id="start-game-status" class="feature-status">養成系統尚未開放</p>
            <button id="match-test-button" class="secondary-button" type="button">
              比賽測試系統
            </button>
          </div>
        </div>
      </section>

      <section id="lineup-view" class="lineup-view" aria-labelledby="lineup-title" hidden>
        <header class="match-header">
          <p class="eyebrow">STARTING LINEUP</p>
          <h1 id="lineup-title" tabindex="-1">本場比賽</h1>
          <div class="match-header__line" aria-hidden="true"></div>
          <p class="match-opponent">
            <span aria-hidden="true">VS</span>
            <span id="opponent-team-name">對手球隊</span>
          </p>
          <p id="lineup-notice" class="lineup-notice" role="status" aria-live="polite"></p>
        </header>

        <section class="lineup-board" aria-label="先發名單">
          <div id="lineup-slots" class="lineup-slots"></div>

          <footer class="lineup-actions">
            <button id="confirm-lineup-button" class="confirm-button" type="button" disabled>
              確認
            </button>
          </footer>
        </section>
      </section>

      <section id="court-view" class="court-view" aria-labelledby="court-match-name" hidden>
        <header class="court-header">
          <p class="eyebrow">MATCH</p>
          <h1 id="court-match-name" tabindex="-1">本場比賽</h1>
          <div class="court-scoreboard" aria-label="目前比分">
            <span id="court-home-team-name">我方球隊</span>
            <strong>
              <span id="court-home-score">0</span>
              <span aria-hidden="true">：</span>
              <span id="court-away-score">0</span>
            </strong>
            <span id="court-away-team-name">對手球隊</span>
          </div>
        </header>

        <section id="serve-result-test-controls" class="serve-result-test-controls" aria-label="單次發球測試" hidden>
          <h2>單次發球測試</h2>
          <div>
            <button type="button" data-serve-test-result="ACE">測試 ACE</button>
            <button type="button" data-serve-test-result="OUT">測試出界</button>
            <button type="button" data-serve-test-result="NET">測試掛網</button>
          </div>
          <p id="serve-result-test-status" role="status" aria-live="polite"></p>
        </section>

        <section id="court-dev-animation" class="court-dev-animation" aria-label="正式球員動作測試" hidden>
          <h2>正式球員動作測試</h2>
          <div class="court-dev-animation__selectors">
            <label>
              <span>場上球員</span>
              <select id="dev-player-id"></select>
            </label>
            <label>
              <span>動作</span>
              <select id="dev-player-action"></select>
            </label>
          </div>
          <div id="dev-move-fields" class="court-dev-animation__move" hidden>
            <label>
              <span>MOVE X</span>
              <input id="dev-move-x" type="number" min="0" max="2280" step="1" />
            </label>
            <label>
              <span>MOVE Y</span>
              <input id="dev-move-y" type="number" min="0" max="900" step="1" />
            </label>
          </div>
          <div class="court-dev-animation__actions">
            <button id="dev-run-action" type="button">執行動作</button>
            <button id="dev-reset-actions" type="button">重設待機與位置</button>
          </div>
        </section>

        <div id="court-viewport" class="court-viewport" aria-label="比賽視窗">
          <div id="court-world" class="court-world"></div>
        </div>

        <section class="match-controls" aria-label="玩家操作區">
          <div class="match-control-block">
            <h2>基本戰術</h2>
            <button type="button" disabled>尚未實作</button>
          </div>
          <div class="match-control-block">
            <h2>特殊戰術</h2>
            <div class="special-tactic-slots">
              <button type="button" disabled>空</button>
              <button type="button" disabled>空</button>
              <button type="button" disabled>空</button>
              <button type="button" disabled>空</button>
            </div>
          </div>
          <button class="timeout-button" type="button" disabled>暫停（尚未實作）</button>
        </section>

        <section id="court-dev-tools" class="court-dev-tools" aria-label="開發座標工具" hidden>
          <p id="court-coordinate-output">點擊球場取得世界座標</p>
          <button id="copy-court-coordinate" type="button" disabled>複製座標</button>
          <label for="dev-ball-x">測試排球 X</label>
          <input id="dev-ball-x" type="range" min="0" max="2280" step="1" value="1140" />
          <p id="dev-ball-state">排球 X: 1140，Y: 450，高度: 0</p>
        </section>
      </section>
    </main>

    <dialog id="player-selector-dialog" class="player-dialog" aria-labelledby="player-dialog-title">
      <div class="player-dialog__header">
        <div>
          <p class="eyebrow">SELECT PLAYER</p>
          <h2 id="player-dialog-title">選擇球員</h2>
        </div>
        <button id="close-player-dialog" class="dialog-close" type="button" aria-label="關閉選人視窗">×</button>
      </div>
      <p id="player-dialog-description" class="player-dialog__description"></p>
      <div id="player-options" class="player-options"></div>
      <div class="player-dialog__footer">
        <button id="clear-slot-button" class="secondary-button" type="button">清除此槽位</button>
        <button id="cancel-player-dialog" class="secondary-button" type="button">取消</button>
      </div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
